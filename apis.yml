name: Udaan
description: 'Udaan is India''s largest eB2B trade platform, connecting small businesses
  - kirana stores, chemists, hotels, restaurants, and offices - with manufacturers, brands,
  and wholesalers across categories including FMCG, staples, fruits and vegetables, pharma,
  and general merchandise. The platform combines supply chain and logistics operations with
  financial services for small businesses through udaanCapital, its working-capital fintech
  arm. Udaan is backed by Lightspeed Venture Partners and GGV Capital. It publishes no public
  developer API; buyer and seller experiences are delivered through its web and mobile apps,
  with api.udaan.com serving as the private app backend.'
